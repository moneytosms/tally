<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">tally architecture</title>
  <desc id="d">A PWA talks to one Cloudflare Worker on a single origin. The Worker serves static assets and the Hono API, backed by D1 through Drizzle, with Durable Object alarms for scheduled work.</desc>
  <rect width="1200" height="280" rx="26" fill="#f7f4ec"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="25.5" fill="none" stroke="#e0d9c8"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#23241d" text-anchor="middle">
    <g stroke="#5c7355" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M250 140 H340"/><path d="M700 140 H760 V80 H830"/><path d="M700 140 H760 V200 H830"/>
    </g>
    <rect x="60" y="100" width="190" height="80" rx="14" fill="#fffdf8" stroke="#e0d9c8"/><text x="155" y="135">React PWA</text><text x="155" y="160" font-size="14" fill="#7d7a68">Vite · TanStack Query</text>
    <rect x="340" y="40" width="360" height="200" rx="18" fill="#e6ece0" stroke="#c7d3bf"/><text x="520" y="76" font-weight="700">one Worker · one origin</text>
    <rect x="368" y="100" width="150" height="56" rx="12" fill="#fffdf8"/><text x="443" y="134">static assets</text>
    <rect x="530" y="100" width="150" height="56" rx="12" fill="#fffdf8"/><text x="605" y="134">/api  Hono</text>
    <text x="520" y="206" font-size="15" fill="#6b7a63">Zod shared · SimpleWebAuthn</text>
    <rect x="830" y="50" width="230" height="60" rx="14" fill="#fffdf8" stroke="#e0d9c8"/><text x="945" y="86">D1 · Drizzle</text>
    <rect x="810" y="170" width="270" height="60" rx="14" fill="#f2e4dd" stroke="#e0cbc0"/><text x="945" y="206" font-size="18">Durable Object alarms</text>
  </g>
</svg>
