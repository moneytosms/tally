<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm paper background -->
  <rect width="512" height="512" fill="#f7f4ec"/>

  <!-- Tally mark: four vertical strokes with a diagonal stroke through -->
  <!-- Stroke group centered and scaled for 512px canvas -->
  <g transform="translate(256, 256)">
    <!-- Four vertical strokes -->
    <rect x="-120" y="-140" width="24" height="280" fill="#5c7355" rx="4"/>
    <rect x="-40" y="-140" width="24" height="280" fill="#5c7355" rx="4"/>
    <rect x="40" y="-140" width="24" height="280" fill="#5c7355" rx="4"/>
    <rect x="120" y="-140" width="24" height="280" fill="#5c7355" rx="4"/>

    <!-- Diagonal stroke through the middle (rotated 45 degrees) -->
    <rect x="-20" y="-20" width="40" height="200" fill="#5c7355" rx="4" transform="rotate(45)"/>
  </g>
</svg>
